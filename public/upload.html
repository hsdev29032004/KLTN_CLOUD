<!doctype html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <title>Upload Video</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 720px;
            margin: 32px auto;
            padding: 0 16px
        }

        h2 {
            margin-bottom: 8px
        }

        .row {
            margin: 10px 0
        }

        progress {
            width: 100%;
            height: 18px
        }

        .msg {
            margin-top: 10px;
            padding: 8px;
            background: #f3f3f3;
            border-radius: 6px
        }
    </style>
</head>

<body>
    <h2>Tải lên video</h2>
    <p>Chọn file video từ thiết bị và nhấn <b>Upload</b>.</p>

    <div class="row">
        <label>Lesson ID (tùy chọn):<br>
            <input id="lessonId" type="text" placeholder="lesson-..." style="width:100%" value="" />
        </label>
    </div>

    <div class="row">
        <label>Chọn file video:<br>
            <input id="fileInput" type="file" accept="video/*" />
        </label>
    </div>

    <div class="row">
        <button id="uploadBtn">Upload</button>
    </div>

    <div class="row">
        <progress id="progress" value="0" max="100" style="display:none"></progress>
    </div>

    <div id="result" class="msg" style="display:none"></div>

    <script>
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const progressEl = document.getElementById('progress');
        const resultEl = document.getElementById('result');
        const lessonIdEl = document.getElementById('lessonId');

        function showMessage(text, isError) {
            resultEl.style.display = 'block';
            resultEl.style.background = isError ? '#ffeded' : '#eef7ea';
            resultEl.textContent = text;
        }

        uploadBtn.addEventListener('click', () => {
            const file = fileInput.files[0];
            if (!file) return showMessage('Vui lòng chọn 1 file video để upload.', true);

            const fd = new FormData();
            fd.append('video', file);
            const lessonId = lessonIdEl.value.trim();
            if (lessonId) fd.append('lessonId', lessonId);

            const xhr = new XMLHttpRequest();
            const API_URL = 'http://localhost:3002/api/videos';
            xhr.open('POST', API_URL, true);
            xhr.withCredentials = true; // gửi cookie nếu cần

            xhr.upload.onprogress = (ev) => {
                if (ev.lengthComputable) {
                    const pct = Math.round((ev.loaded / ev.total) * 100);
                    progressEl.style.display = 'block';
                    progressEl.value = pct;
                }
            };

            xhr.onload = () => {
                if (xhr.status >= 200 && xhr.status < 300) {
                    showMessage('Upload thành công. Server trả về: ' + xhr.responseText, false);
                    progressEl.value = 100;
                } else {
                    showMessage('Upload thất bại. Mã: ' + xhr.status + '. ' + xhr.responseText, true);
                }
            };

            xhr.onerror = () => showMessage('Có lỗi khi upload.', true);

            xhr.send(fd);
            showMessage('Đang upload...', false);
        });
    </script>
</body>

</html>
